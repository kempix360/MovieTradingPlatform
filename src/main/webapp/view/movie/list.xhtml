<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/template/main.xhtml">

    <ui:define name="content" >
        <f:event type="preRenderView" listener="#{authView.checkAuth}" />
        <h2>#{messages['movies.title']}</h2>
        <h:form>
            <h:dataTable value="#{movieList.movies}" var="movie">
                <h:column>
                    <f:facet name="header">#{messages['movie.field.title']}</f:facet>
                    #{movie.title}
                </h:column>
                <h:column>
                    <f:facet name="header">#{messages['movie.field.director']}</f:facet>
                    <h:panelGroup>
                        <h:link rendered="#{not empty movie.director}" outcome="/view/director/view.xhtml">
                            <f:param name="id" value="#{movie.director.id}" />
                            #{movie.director.name}
                        </h:link>
                        <h:outputText rendered="#{empty movie.director}" value="-" />
                    </h:panelGroup>
                </h:column>
                <h:column>
                    <f:facet name="header">#{messages['table.actions']}</f:facet>
                    <h:link outcome="/view/movie/view.xhtml">
                        <f:param name="id" value="#{movie.id}" />
                        #{messages['actions.view']}
                    </h:link>
                    &#160;
                    <h:commandButton value="#{messages['actions.delete']}" action="#{movieList.delete(movie.id)}" rendered="#{authView.isAdmin() or authView.isOwner(movie.user.id)}" />
                </h:column>
            </h:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
