<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{movieForm.id}" />
        <f:viewParam name="artistId" value="#{movieForm.artistId}" />
        <f:viewAction action="#{movieForm.init}" />
    </f:metadata>

    <ui:define name="content">
        <f:event type="preRenderView" listener="#{authView.checkAuth}" />
        <h2>#{messages['song.form.title']}</h2>

        <h:form>
            <h:panelGrid columns="2">
                <h:outputText value="Title:" />
                <h:inputText value="#{movieForm.song.title}" />

                <h:outputText value="Genre:" />
                <h:selectOneMenu value="#{movieForm.song.genre}">
                    <f:selectItems value="#{movieForm.genres}" var="g" itemLabel="#{g}" itemValue="#{g}" />
                </h:selectOneMenu>

                <h:outputText value="Release year (YYYY-MM-DD):" />
                <h:inputText value="#{movieForm.releaseYearString}" />

                <h:outputText value="Duration:" />
                <h:inputText value="#{movieForm.song.duration}" />

                <h:outputText value="Artist:" />
                <h:selectOneMenu value="#{movieForm.song.artist}" converter="artistDtoConverter">
                    <f:selectItems value="#{movieForm.artists}" var="a" itemLabel="#{a.name}" itemValue="#{a}" />
                </h:selectOneMenu>
            </h:panelGrid>

            <h:commandButton value="#{messages['form.save']}" action="#{songForm.save}" />
            <h:commandButton value="#{messages['form.cancel']}" action="/artists/list.xhtml?faces-redirect=true" immediate="true" />
        </h:form>
    </ui:define>
</ui:composition>
