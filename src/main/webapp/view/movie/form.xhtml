<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{movieForm.movieId}" />
        <f:viewParam name="directorId" value="#{movieForm.directorId}" />
        <f:viewAction action="#{movieForm.init}" />
    </f:metadata>

    <ui:define name="content">
        <f:event type="preRenderView" listener="#{authView.checkAuth}" />
        <h2>#{messages['movie.form.title']}</h2>

        <h:form>
            <h:panelGrid columns="2">
                <h:outputText value="Title:" />
                <h:inputText value="#{movieForm.movie.title}" />

                <h:outputText value="Genres:" />
                <h:selectManyMenu value="#{movieForm.movie.genres}">
                    <f:selectItems value="#{movieForm.availableGenres}" var="g" itemLabel="#{g}" itemValue="#{g}" />
                </h:selectManyMenu>

                <h:outputText value="Release date (YYYY-MM-DD):" />
                <h:inputText value="#{movieForm.movie.releaseDate}" />

<!--                <h:outputText value="Director:" />-->
<!--                <h:selectOneMenu value="#{movieForm.directorId}">-->
<!--                    <f:selectItems value="#{movieForm.availableDirectors}" var="d" itemLabel="#{d.name}" itemValue="#{d.id}" />-->
<!--                </h:selectOneMenu>-->
            </h:panelGrid>

            <h:commandButton value="#{messages['form.save']}" action="#{movieForm.save}" />
            <h:commandButton value="#{messages['form.cancel']}" action="/view/movie/list.xhtml?faces-redirect=true" immediate="true" />
        </h:form>
    </ui:define>
</ui:composition>
