<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{movieView.id}" />
        <f:viewAction action="#{movieView.init}" />
    </f:metadata>

    <ui:define name="content">
        <f:event type="preRenderView" listener="#{authView.checkAuth}" />
        <h2>Movie details</h2>
        <h:outputText value="#{messages['notfound']}" rendered="#{movieView.notFound}" />

        <h:panelGroup rendered="#{not movieView.notFound}">
            <h:panelGrid columns="2">
                <h:outputText value="Title:" />
                <h:outputText value="#{movieView.movie.title}" />
                <h:outputText value="Genres:" />
                <h:outputText value="#{movieView.movie.genres}" />
                <h:outputText value="Release date:" />
                <h:outputText value="#{movieView.movie.releaseDate}" />
                <h:outputText value="Director:" />
                <h:panelGroup>
                    <h:link rendered="#{not empty movieView.movie.director}" outcome="/view/director/view.xhtml">
                        <f:param name="id" value="#{movieView.movie.director.id}" />
                        #{movieView.movie.director.name}
                    </h:link>
                    <h:outputText rendered="#{empty movieView.movie.director.id}" value="-" />
                </h:panelGroup>
            </h:panelGrid>

            <h:form>
                <h:commandButton value="#{messages['actions.delete']}" action="#{movieView.delete}" rendered="#{authView.isAdmin() or authView.isOwner(movieView.movie.user.id)}"/>
                &#160;
                <h:link outcome="/view/movie/form.xhtml" rendered="#{authView.isAdmin() or authView.isOwner(movieView.movie.user.id)}">
                    <f:param name="id" value="#{movieView.id}" />
                    #{messages['actions.edit']}
                </h:link>
            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
