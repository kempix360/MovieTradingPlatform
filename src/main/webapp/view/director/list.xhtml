<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/template/main.xhtml">

    <ui:define name="content">
        <f:event type="preRenderView" listener="#{authView.checkAuth}" />
        <h2>#{messages['directors.title']}</h2>

        <h:form id="directorsForm">
            <h:dataTable id="directorsTable" value="#{directorList.directors}" var="director">
                <h:column>
                    <f:facet name="header">#{messages['directors.header.name']}</f:facet>
                    #{director.name}
                </h:column>
                <h:column>
                    <f:facet name="header">#{messages['table.actions']}</f:facet>
                    <h:link outcome="/view/director/view.xhtml" value="#{messages['actions.view']}">
                        <f:param name="id" value="#{director.id}"/>
                    </h:link>
                    &#160;
                    <h:commandButton value="#{messages['actions.delete']}" action="#{directorList.deleteDirector(director.id)}" rendered="#{authView.isAdmin()}">
                        <f:ajax execute="@this" render="directorsTable" />
                    </h:commandButton>
                </h:column>
            </h:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
