<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{directorView.id}" />
        <f:viewAction action="#{directorView.init}" />
    </f:metadata>

    <ui:define name="content">
        <f:event type="preRenderView" listener="#{authView.checkAuth}" />
        <h2>#{messages['directors.view.title']}</h2>

        <h:outputText value="#{messages['notfound']}" rendered="#{directorView.notFound}" />

        <h:panelGroup rendered="#{not directorView.notFound}">
            <h:panelGrid columns="2">
                <h:outputText value="#{messages['director.field.name']}" />
                <h:outputText value="#{directorView.director.name}" />
                <h:outputText value="#{messages['director.field.description']}" />
                <h:outputText value="#{directorView.director.description}" />
            </h:panelGrid>

            <h:form>
                <h:commandButton value="#{messages['director.delete']}" action="#{directorView.deleteDirector(directorView.id)}" rendered="#{authView.isAdmin()}"/>
            </h:form>
            <h:form>
                <h:link outcome="/view/movie/form.xhtml" value="#{messages['movie.add']}" rendered="#{not empty request.userPrincipal}">
                    <f:param name="directorId" value="#{directorView.id}" />
                </h:link>
            </h:form>

            <h3>#{messages['director.movies.header']}</h3>
            <h:form id="moviesForm">
                <h:inputHidden id="directorId" value="#{directorView.id}" />
                <h:dataTable id="moviesTable" value="#{directorView.movies}" var="movie">
                    <h:column>
                        <f:facet name="header">#{messages['movie.field.title']}</f:facet>
                        #{movie.title}
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{messages['movie.field.director']}</f:facet>
                        <h:link outcome="/view/movie/view.xhtml">
                            <f:param name="id" value="#{movie.id}" />
                            #{messages['actions.view']}
                        </h:link>
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{messages['actions.edit']}</f:facet>
                        <h:link outcome="/view/movie/form.xhtml" rendered="#{authView.isAdmin() or authView.isOwner(movie.user.id)}">
                            <f:param name="id" value="#{movie.id}" />
                            #{messages['actions.edit']}
                        </h:link>
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{messages['table.actions']}</f:facet>
                        <h:commandButton value="#{messages['actions.delete']}" action="#{directorView.deleteSelectedMovie}" rendered="#{authView.isAdmin() or authView.isOwner(movie.user.id)}">
                            <f:setPropertyActionListener target="#{directorView.movieToDeleteId}" value="#{movie.id}" />
                            <f:ajax execute="@this" render="moviesTable" />
                        </h:commandButton>
                    </h:column>
                </h:dataTable>
            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
